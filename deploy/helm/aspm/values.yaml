image:
  repository: aspm
  tag: 0.1.0-dev
  pullPolicy: IfNotPresent
existingSecret: aspm-secrets
publicOrigin: ""
core:
  replicas: 1
  prepareReadiness: false
  s3Secret:
    name: aspm-core-storage
    accessKeyKey: core-s3-access-key
    secretKeyKey: core-s3-secret-key
  rawPrefix: evidence/
  readinessKey: evidence/system/readiness.txt
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
ingestion:
  replicas: 1
  s3Secret:
    name: aspm-ingestion-storage
    accessKeyKey: ingestion-s3-access-key
    secretKeyKey: ingestion-s3-secret-key
  rawPrefix: evidence/
  readinessKey: evidence/system/readiness.txt
  normalizedPrefix: normalized/
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
reports:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
database:
  managed: true
  image: postgres:18.6-alpine
  name: aspm
  user: aspm
  schema: aspm
  maxConnectionsPerReplica: 5
  storage: 10Gi
  storageClass: ""
storage:
  managed: true
  image: chrislusf/seaweedfs:4.47
  policySecret:
    name: aspm-storage-policy
    key: s3.json
  endpoint: ""
  bucket: aspm-evidence
  prefix: evidence/
  region: us-east-1
  size: 10Gi
  storageClass: ""
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
