{{- include "aspm.validateCollection" . -}}
{{- include "aspm.validateDelivery" . -}}
{{- include "aspm.validateAssessment" . -}}
{{- $root := . -}}
{{- $roles := list "core" "ingestion" "reports" -}}
{{- $delivery := .Values.delivery | default dict -}}
{{- if get $delivery "enabled" -}}
{{- $roles = append $roles "delivery" -}}
{{- end -}}
{{- if .Values.collection.enabled -}}
{{- $roles = append $roles "collection" -}}
{{- end -}}
{{- if .Values.assessment.enabled -}}
{{- $roles = append $roles "assessment" -}}
{{- end -}}
{{- range $role := $roles }}
{{- $config := index $root.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aspm.name" $root }}-{{ $role }}
  labels: {app.kubernetes.io/name: aspm, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aspm, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
      containers:
        - name: {{ $role }}
          image: {{ printf "%s:%s" $root.Values.image.repository $root.Values.image.tag | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: [{{ if eq $role "core" }}"/app/bin/core-api"{{ else if eq $role "reports" }}"/app/bin/report-worker"{{ else if eq $role "delivery" }}"/app/bin/delivery-worker"{{ else if eq $role "collection" }}"/app/bin/collection-worker"{{ else if eq $role "assessment" }}"/app/bin/assessment-worker"{{ else }}"/app/bin/ingestion"{{ end }}]
          ports: [{name: http, containerPort: 8080}]
          env:
            {{- include "aspm.environment" (dict "root" $root "role" $role) | nindent 12 }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe: {httpGet: {path: /readyz, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
      {{- if eq $role "assessment" }}
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 256Mi}}]
      {{- else }}
      volumes: [{name: tmp, emptyDir: {sizeLimit: 2Gi}}]
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aspm.name" . }}-core
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: core}
  ports: [{name: http, port: 8080, targetPort: http}]
