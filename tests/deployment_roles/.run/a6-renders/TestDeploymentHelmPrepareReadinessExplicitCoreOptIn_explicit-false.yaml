# Source: aspm/templates/application.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: role-probe-aspm-core
  labels: {app.kubernetes.io/name: aspm, app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: core}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: core}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aspm, app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: core}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: core}
      containers:
        - name: core
          image: "aspm:0.1.0-dev"
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/core-api"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: ASPM_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: "synthetic-operator-control-plane", key: database-url}
            - name: ASPM_SCHEMA
              value: "aspm"
            - name: ASPM_DB_MAX_CONNECTIONS
              value: "5"
            - name: ASPM_PUBLIC_ORIGIN
              value: ""
            - name: ASPM_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: {name: "synthetic-operator-control-plane", key: bootstrap-token, optional: true}
            - name: ASPM_S3_ENDPOINT
              value: "http://role-probe-aspm-storage:8333"
            - name: ASPM_S3_BUCKET
              value: "aspm-evidence"
            - name: ASPM_S3_PREFIX
              value: "raw/team-a/"
            - name: ASPM_S3_READINESS_KEY
              value: "raw/team-a/readiness.txt"
            - name: ASPM_S3_REGION
              value: "us-east-1"
            - name: ASPM_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: "synthetic-core-storage", key: "core-s3-access-key"}
            - name: ASPM_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: "synthetic-core-storage", key: "core-s3-secret-key"}
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe: {httpGet: {path: /readyz, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
      volumes: [{name: tmp, emptyDir: {sizeLimit: 2Gi}}]

