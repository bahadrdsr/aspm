# Source: aspm/templates/storage.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: role-probe-aspm-postgres
spec:
  serviceName: role-probe-aspm-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aspm, app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: "postgres:18.6-alpine"
          env:
            - {name: POSTGRES_DB, value: "aspm"}
            - {name: POSTGRES_USER, value: "aspm"}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: "synthetic-operator-control-plane", key: postgres-password}}
          ports: [{name: postgres, containerPort: 5432}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "aspm", "-d", "aspm"]}
            initialDelaySeconds: 5
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: "10Gi"}}

---
# Source: aspm/templates/storage.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: role-probe-aspm-storage
spec:
  serviceName: role-probe-aspm-storage
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: storage}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aspm, app.kubernetes.io/instance: role-probe, app.kubernetes.io/component: storage}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: storage
          image: "chrislusf/seaweedfs:4.47"
          args: ["mini", "-dir=/data", "-s3.config=/etc/seaweed/s3.json", "-bucket=aspm-evidence", "-master.telemetry=false", "-admin.ui=false", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.iam=false", "-s3.allowDeleteBucketNotEmpty=false", "-filer.disableDirListing=true", "-filer.exposeDirectoryData=false"]
          ports: [{name: s3, containerPort: 8333}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: credentials, mountPath: /etc/seaweed, readOnly: true}
          readinessProbe: {tcpSocket: {port: s3}, initialDelaySeconds: 5, periodSeconds: 5}
      volumes:
        - name: credentials
          secret: {secretName: "aspm-storage-policy", items: [{key: "s3.json", path: s3.json}]}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: "10Gi"}}
